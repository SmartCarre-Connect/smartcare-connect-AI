services:
  - type: web
    name: smartcare-connect-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: smartcare_connect
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://smartcare-connect-ai.vercel.app
      - key: UPLOAD_DIR
        value: uploads
  - type: web
    name: smartcare-connect-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://smartcare-connect-api.onrender.com/api/v1
